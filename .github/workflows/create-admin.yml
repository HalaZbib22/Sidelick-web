# One-click admin-account provisioning, run manually from the Actions tab.
# Uses the same SSH secrets as deploys; the bcrypt hash comes from the
# ADMIN_PASSWORD_HASH secret so nothing sensitive lives in this public repo
# (GitHub also masks secret values in run logs).
name: Create admin account

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Admin email"
        required: true
        default: "halazbib22@gmail.com"
      first_name:
        description: "First name"
        required: true
        default: "Hala"
      last_name:
        description: "Last name"
        required: true
        default: "Zbib"

jobs:
  create-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Create admin on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            docker exec -i sidelick-postgres psql -U sidelick -d sidelick <<'SQL'
            BEGIN;
            DELETE FROM users WHERE email = '${{ inputs.email }}';
            INSERT INTO users (role, first_name, last_name, email, password_hash)
            VALUES ('admin', '${{ inputs.first_name }}', '${{ inputs.last_name }}', '${{ inputs.email }}', '${{ secrets.ADMIN_PASSWORD_HASH }}');
            COMMIT;
            SQL
            echo "Admin account ready."
